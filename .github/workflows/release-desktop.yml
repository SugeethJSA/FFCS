name: Release Desktop
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri deps (ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --filter api db:generate
      - name: Build Web (for Tauri frontendDist)
        run: pnpm --filter web build
      - name: Zip extension (optional)
        run: pnpm --filter extension build || echo "no zip script"
      - name: Build Tauri
        run: pnpm --filter desktop build
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ffcs-track-${{ matrix.os }}
          path: apps/desktop/src-tauri/target/release/bundle/**/*
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/desktop/src-tauri/target/release/bundle/**/*

  updater:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "{\"version\":\"$TAG\",\"notes\":\"FFCS Track $TAG\",\"pub_date\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"platforms\":{\"windows-x86_64\":{\"signature\":\"\",\"url\":\"https://github.com/${{ github.repository }}/releases/download/$TAG/FFCS_Track_${TAG#v}_x64_en-US.msi.zip\"}}}" > latest.json
          cat latest.json
      - uses: actions/upload-artifact@v4
        with: { name: latest-json, path: latest.json }
