[package]
name = "ffcs-desktop"
version = "1.0.0"
description = "FFCS Track Desktop"
authors = ["AmazeContinuityProjects"]
edition = "2021"
repository = "https://github.com/AmazeContinuityProjects/FFCS"
license = "MIT"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
