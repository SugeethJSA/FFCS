services:
  db:
    image: postgres:16-alpine
    container_name: ffcs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ffcs
      POSTGRES_PASSWORD: ffcs_dev_password
      POSTGRES_DB: ffcs
    ports:
      - "5432:5432"
    volumes:
      - ffcs_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ffcs -d ffcs"]
      interval: 5s
      timeout: 2s
      retries: 10

  # Optional: pgAdmin for visual DB inspection at http://localhost:5050
  # pgadmin:
  #   image: dpage/pgadmin4:8
  #   environment:
  #     PGADMIN_DEFAULT_EMAIL: admin@ffcs.local
  #     PGADMIN_DEFAULT_PASSWORD: admin
  #   ports:
  #     - "5050:80"
  #   depends_on:
  #     db:
  #       condition: service_healthy

volumes:
  ffcs_pgdata:
